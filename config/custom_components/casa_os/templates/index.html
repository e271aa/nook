<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{ title }}</title>
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/casa_os_static/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/casa_os_static/icone-192.png" />
    <link rel="icon" href="/casa_os_static/icone-192.png" />
    <link rel="stylesheet" href="/casa_os_static/css/tokens.css?v={{ version }}" />
    <link rel="stylesheet" href="/casa_os_static/css/app.css?v={{ version }}" />
    <script>
      // Paleta e modo guardados, aplicados antes de pintar (o automático, até a
      // casa dizer onde está o sol, vai pela hora)
      (function () {
        try {
          var t = localStorage.getItem("casa_os_theme");
          var m = localStorage.getItem("casa_os_modo");
          if (t === "claro") {
            t = "grafite";
            m = m || "claro";
          }
          if (m === "auto") {
            var h = new Date().getHours();
            m = h >= 7 && h < 20 ? "claro" : "escuro";
          }
          if (t) document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-modo", m === "claro" ? "claro" : "escuro");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    {{ sprite | safe }}

    <div id="app">
      <div class="boot">
        <div class="dot"></div>
        <p>A ligar à casa…</p>
      </div>
    </div>

    <script id="casa-config" type="application/json">{{ config_json | safe }}</script>
    <script>
      window.CASA = {
        token: "{{ token }}",
        user: "{{ user_name }}",
        title: "{{ title }}",
        config: JSON.parse(document.getElementById("casa-config").textContent || "{}"),
      };
    </script>
    <script src="/casa_os_static/js/ha.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/defs.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/ui.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/kit.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/views.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/divisoes.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/controlos.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/vigilancia.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/energia-agora.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/energia-graficos.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/energia.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/rotina.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/planta.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/dashboard.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/definicoes.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/app.js?v={{ version }}"></script>
  </body>
</html>
