<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{ title }}</title>
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/casa_os_static/css/tokens.css?v={{ version }}" />
    <link rel="stylesheet" href="/casa_os_static/css/app.css?v={{ version }}" />
    <script>
      // Paleta guardada, aplicada antes de pintar
      (function () {
        try {
          var t = localStorage.getItem("casa_os_theme");
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    {{ sprite | safe }}

    <div id="app">
      <div class="boot">
        <div class="dot"></div>
        <p>A ligar à casa…</p>
      </div>
    </div>

    <script id="casa-config" type="application/json">{{ config_json | safe }}</script>
    <script>
      window.CASA = {
        token: "{{ token }}",
        user: "{{ user_name }}",
        title: "{{ title }}",
        config: JSON.parse(document.getElementById("casa-config").textContent || "{}"),
      };
    </script>
    <script src="/casa_os_static/js/ha.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/ui.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/views.js?v={{ version }}"></script>
    <script src="/casa_os_static/js/app.js?v={{ version }}"></script>
  </body>
</html>
