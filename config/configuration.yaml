# ───────────────────────────────────────────────────────────────
#  Nook — Demo
#  Home Assistant com uma moradia simulada (integração casa_demo)
# ───────────────────────────────────────────────────────────────

# Só o que o Nook usa, em vez de `default_config`: assim o Home Assistant não
# procura aparelhos na rede (zeroconf, ssdp, dhcp, usb, bluetooth) nem liga à
# cloud. O resto (automações, pessoas, câmaras, listas) vem mais abaixo ou é
# carregado pela casa simulada.
frontend:
history:
logbook:
sun:

homeassistant:
  name: Nook Demo
  latitude: 38.7369
  longitude: -9.1427
  elevation: 70
  unit_system: metric
  currency: EUR
  country: PT
  language: pt
  time_zone: Europe/Lisbon
  # Entrada direta como "Visitante" (sem permissões de admin), tal como a
  # demo oficial do Home Assistant. O administrador entra com password
  # escolhendo "Home Assistant Local" no ecrã de login.
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 0.0.0.0/0
        - ::/0
      trusted_users: !include_dir_merge_named trusted
      allow_bypass_login: true
    - type: homeassistant

# A configuração HTTP (proxy de confiança, bloqueio por palavras-passe erradas)
# já não vive aqui: desde o HA 2026.9 fica em .storage/http. Quem a põe lá é o
# bootstrap, com o endereço do proxy definido no docker-compose.yml.

logger:
  default: warning
  logs:
    custom_components.casa_demo: info

# Menos escritas no disco. O histórico detalhado dura 2 dias; as estatísticas de
# energia são de longo prazo e não entram na purga. Fica de fora o que muda de
# poucos em poucos segundos e que o painel só mostra ao vivo. Grava-se de 5 em
# 5 segundos porque o diário do painel conta com isso.
# Num cartão SD, RECORDER_DB_URL no .env põe a base de dados em memória: não
# gasta o cartão e a casa simulada refaz os 30 dias de energia a cada arranque.
recorder:
  db_url: !env_var RECORDER_DB_URL sqlite:////config/home-assistant_v2.db
  purge_keep_days: 2
  commit_interval: 5
  exclude:
    domains:
      - device_tracker
      - climate
      - camera
    entity_globs:
      - sensor.potencia_*
      - sensor.memory_*
      - sensor.processor_*

lovelace:
  dashboards:
    dashboard-nook:
      mode: yaml
      filename: dashboards/nook.yaml
      title: Nook
      icon: mdi:home-heart
      show_in_sidebar: true
      require_admin: false

input_select:
  tv_sala_fonte:
    name: Fonte da TV
    icon: mdi:television
    options:
      - TV
      - HDMI 1
      - HDMI 2
      - HDMI 3
    initial: TV

# Casa simulada
casa_demo:

# Casa OS — a interface unificada (demo principal)
casa_os:
  demo_user: Visitante
  title: Nook

person:
  - name: Ana
    id: ana
    device_trackers:
      - device_tracker.ana_telemovel
  - name: Miguel
    id: miguel
    device_trackers:
      - device_tracker.miguel_telemovel

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
